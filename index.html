<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Flowers Background</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="background-container"></div>

    <main class="content-card">
        <h1>Gift Wheel</h1>

        <div class="wheel-container">
            <div class="wheel-stand"></div>
            <div class="indicator"></div>
            <div class="wheel" id="wheel">
                <div class="wheel-spoke-3"></div>
                <div class="wheel-cabin cabin-1">🎁</div>
                <div class="wheel-cabin cabin-2">🎁</div>
                <div class="wheel-cabin cabin-3">🎁</div>
            </div>
        </div>

        <button class="spin-btn" id="spin-btn">Spin to Win!</button>
        <div id="result-message"></div>
    </main>

    <script src="script.js"></script>
</body>

</html>
